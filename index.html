<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>세법 빈칸 훈련</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#27466F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="세법빈칸">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
<style>
/* 법령집 같은 차분한 남색 한 가지를 기준색으로, 정답·오답·주의는 별도 의미색. 좌측 목차 + 우측 작업면 2단 */
:root{
  --bg:#F4F5F8; --surface:#FFFFFF; --ink:#1A2130; --muted:#5A6375; --faint:#8A92A3; --line:#DDE1E8;
  --accent:#27466F; --accent-ink:#FFFFFF; --accent-soft:#E5EBF4;
  --f2:#1F66B3; --f2-soft:#E3EEFA; --f3:#7A3DB8; --f3-soft:#F0E7FA; --f4:#C2410C; --f4-soft:#FCEADF; --pr:#0B7A75; --pr-soft:#DDF3F1;
  --ok:#1E7448; --ok-soft:#E2F1E8; --bad:#AF3329; --bad-soft:#F8E5E3; --warn:#8C5C08; --warn-soft:#FAEFD8;
  --f-display:"Noto Serif KR","Nanum Myeongjo",serif;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12151C; --surface:#1A1F29; --ink:#E6E9EF; --muted:#A3ABBA; --faint:#7A8394; --line:#2C3340;
  --accent:#8FB0DE; --accent-ink:#0F1622; --accent-soft:#223149;
  --f2:#7DB4F0; --f2-soft:#17283D; --f3:#C29BF0; --f3-soft:#2A1D3D; --f4:#F59A6B; --f4-soft:#3A2116; --pr:#5ED0C8; --pr-soft:#123532;
  --ok:#6CC596; --ok-soft:#173326; --bad:#F08A7F; --bad-soft:#3A1E1B; --warn:#E3B45C; --warn-soft:#352812;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#12151C; --surface:#1A1F29; --ink:#E6E9EF; --muted:#A3ABBA; --faint:#7A8394; --line:#2C3340;
  --accent:#8FB0DE; --accent-ink:#0F1622; --accent-soft:#223149;
  --f2:#7DB4F0; --f2-soft:#17283D; --f3:#C29BF0; --f3-soft:#2A1D3D; --f4:#F59A6B; --f4-soft:#3A2116; --pr:#5ED0C8; --pr-soft:#123532;
  --ok:#6CC596; --ok-soft:#173326; --bad:#F08A7F; --bad-soft:#3A1E1B; --warn:#E3B45C; --warn-soft:#352812;
  color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6}
.page{max-width:1040px;margin:0 auto;padding:24px 20px 56px;display:flex;flex-direction:column;gap:20px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:14px}
h1{font-family:var(--f-display);font-size:28px;font-weight:700;margin:0;letter-spacing:-0.01em;text-wrap:balance}
h2{font-family:var(--f-display);font-size:21px;font-weight:600;margin:0;text-wrap:balance}
h3{font-size:15px;font-weight:700;margin:0;color:var(--ink)}
.lede{color:var(--muted);font-size:14px;margin:4px 0 0}
.save{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.dot.acct{background:var(--ok)} .dot.local{background:var(--warn)}
button,.btn{font:inherit;font-size:15px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;cursor:pointer;line-height:1.3}
button:hover:not(:disabled){border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:500}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,a:focus-visible,.sec.click:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.back{font-size:14px;text-decoration:none;color:var(--muted);background:none;border:none;padding:0;cursor:pointer}
.back:hover{color:var(--accent)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.subjects{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.subj{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px;text-align:left;cursor:pointer;color:var(--ink)}
.subj:hover:not(:disabled){border-color:var(--accent)}
.subj .nm{font-family:var(--f-display);font-size:19px;font-weight:600}
.subj .ds{font-size:13px;color:var(--muted)}
.chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:500;width:max-content}
.chip.soon{background:var(--bg);color:var(--faint);border:1px solid var(--line)}
.meter{height:6px;border-radius:3px;background:var(--bg);overflow:hidden;border:1px solid var(--line)}
.meter>i{display:block;height:100%;background:var(--accent)}
.meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile b{display:block;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.tile span{font-size:13px;color:var(--muted)}
.tile.weak b{color:var(--bad)} .tile.ok b{color:var(--ok)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.two{display:grid;grid-template-columns:260px 1fr;gap:16px;align-items:start}
@media (max-width:720px){.two{grid-template-columns:1fr}.tiles{grid-template-columns:1fr 1fr 1fr}.toc{position:static}.toc.train .ch{display:none}.toc.train .sec{display:none}.toc.train.open .ch,.toc.train.open .sec,.toc.train .sec.on{display:flex}.toc.train.open .ch{display:block}.nav button{flex:1}.toc.train .toc-toggle{display:block}.two .toc-hint{display:none}}
.toc{font-size:13px;line-height:1.45;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;position:sticky;top:12px}
.toc .ch{font-weight:700;color:var(--ink);margin-top:9px}
.toc .ch:first-child{margin-top:0}
.sec{padding:3px 6px 3px 12px;color:var(--faint);border-radius:6px;display:flex;justify-content:space-between;gap:6px}
.sec.has{color:var(--muted)}
.sec.click{cursor:pointer}
.sec.click:hover{background:var(--bg);color:var(--ink)}
.sec.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.sec .n{font-variant-numeric:tabular-nums;white-space:nowrap}
.sec .n.weak{color:var(--bad)}
.toc .sub{padding:1px 6px 4px 24px;color:var(--accent);font-size:12px}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:52px 1fr 28px;align-items:center;gap:8px;font-size:14px}
.bar i{display:block;height:10px;border-radius:5px;background:var(--warn)}
.bar .v{color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.note{font-size:13px;color:var(--muted)}
.progress{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.progress .meter{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:6px;background:var(--warn-soft);color:var(--warn);font-weight:500}
.sent{font-size:18px;line-height:1.95;margin:10px 0 14px;max-width:62ch}
.blank{display:inline-block;min-width:96px;border-bottom:2px solid var(--accent);text-align:center;color:var(--accent);font-weight:700;padding:0 4px}
.answer{display:flex;gap:8px;flex-wrap:wrap}
.answer input{flex:1;min-width:180px;font:inherit;font-size:16px;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.err{font-size:13px;color:var(--bad);min-height:18px;margin-top:4px}
.verdict{display:inline-block;padding:5px 10px;border-radius:6px;font-size:14px;font-weight:500}
.v-success{background:var(--ok-soft);color:var(--ok)} .v-danger{background:var(--bad-soft);color:var(--bad)} .v-warning{background:var(--warn-soft);color:var(--warn)}
.info{font-size:14px;line-height:1.75;margin-top:12px;border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:2px}
.lab{color:var(--muted);font-size:13px;display:inline-block;min-width:60px}
.ex{margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--bg);font-size:14px;line-height:1.8}
.exh{font-size:12px;color:var(--muted);margin-bottom:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.k{padding:1px 5px;border-radius:5px;font-weight:700}
.k-success{background:var(--ok-soft);color:var(--ok)} .k-danger{background:var(--bad-soft);color:var(--bad)} .k-warning{background:var(--warn-soft);color:var(--warn)}
.exf{margin-top:6px;font-size:13px;color:var(--muted)}
.exf b{font-weight:700}
.next{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.nav{display:flex;justify-content:space-between;gap:8px;margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
button.danger{color:var(--bad);border-color:var(--line)}
button.danger:hover:not(:disabled){border-color:var(--bad)}
button.danger.solid{background:var(--bad);color:var(--surface);border-color:var(--bad);font-weight:500}
.confirm{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--bad)}
.toc-hint{margin:8px 2px 0}
.toc-toggle{display:none;width:100%;margin-bottom:8px;font-size:13px;padding:6px 10px}
.due-panel{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-color:var(--accent)}
.ox-text{font-size:17px;line-height:1.85}
.ox-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4px}
.ox-btn{font-size:34px;font-weight:700;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.1}
.ox-btn span{font-size:13px;font-weight:500;color:var(--muted)}
.ox-btn[data-pick="O"]{color:var(--ok)} .ox-btn[data-pick="X"]{color:var(--bad)}
.ox-btn[data-pick="O"]:hover{border-color:var(--ok);background:var(--ok-soft)} .ox-btn[data-pick="X"]:hover{border-color:var(--bad);background:var(--bad-soft)}
.wrong-list{margin:8px 0 0;padding-left:18px;font-size:14px;line-height:1.7}
.pair-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pair-tip{font-size:14px;color:var(--muted);margin:6px 0 10px;line-height:1.6}
.ptable{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden;font-size:14px}
.prow{display:grid;grid-template-columns:1.3fr 1.2fr 1fr;gap:10px;padding:8px 12px;border-top:1px solid var(--line)}
.prow:first-child{border-top:none}
.phead{background:var(--bg);font-size:12px;color:var(--muted);font-weight:500}
.pans{font-weight:700;color:var(--ok)} .ptrap{color:var(--bad)}
.pref{grid-template-columns:1fr;background:var(--accent-soft);color:var(--accent);font-size:13px}
@media (max-width:720px){.prow{grid-template-columns:1fr;gap:2px}.phead{display:none}.ptrap::before{content:"함정: ";color:var(--muted)}}
.daily-panel{border-color:var(--accent)}
.daily-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.ok-chip{background:var(--ok-soft);color:var(--ok)}
.daily-sum{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.daily-sum b{color:var(--ink);font-variant-numeric:tabular-nums}
.drow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.6}
.drow:first-child{border-top:none}
.dq b{color:var(--accent)}
.dmark{font-size:12px;font-weight:500;padding:2px 8px;border-radius:999px;white-space:nowrap}
.dmark.ok{background:var(--ok-soft);color:var(--ok)} .dmark.bad{background:var(--bad-soft);color:var(--bad)} .dmark.none{background:var(--bg);color:var(--faint);border:1px solid var(--line)}
.hrow{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;width:100%;text-align:left;border:none;border-top:1px solid var(--line);border-radius:0;background:none;padding:11px 2px}
.hrow:first-child{border-top:none}
.hrow:hover{background:var(--bg)}
.hd{font-weight:500}
.bar.wide{grid-template-columns:110px 1fr 40px}
@media (max-width:720px){.drow{grid-template-columns:1fr auto}.drow .chip{grid-column:1/-1}.hrow{grid-template-columns:1fr auto}.hrow .note{grid-column:1/-1;grid-row:2}}
.fq{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap;vertical-align:1px}
.fq.f2{background:var(--f2-soft);color:var(--f2)} .fq.f3{background:var(--f3-soft);color:var(--f3)} .fq.f4{background:var(--f4-soft);color:var(--f4)}
.card.fqcard,.fq-item.fqcard{border-left-width:5px} .card.fqcard.f2,.fq-item.fqcard.f2{border-left-color:var(--f2)} .card.fqcard.f3,.fq-item.fqcard.f3{border-left-color:var(--f3)} .card.fqcard.f4,.fq-item.fqcard.f4{border-left-color:var(--f4)}
.fq-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.fq-legend{display:flex;gap:6px;flex-wrap:wrap}
.fq-panel{border-color:var(--f3)}
button.fq-btn{color:var(--f3);border-color:var(--f3)}
button.tab.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.fq-item{border-width:1px;border-style:solid;border-color:var(--line);border-radius:10px;padding:10px 14px;margin-top:10px;background:var(--surface)}
.fq-item .fq-row{margin-bottom:4px}
.fq-sent{font-size:15px;line-height:1.75}
.fq-sent b{color:var(--accent)}
.prow .fq{margin-left:4px}
.install-row{display:flex;gap:14px;align-items:flex-start}
.install-row img{border-radius:10px;flex:none}
@media (display-mode: standalone){.page{padding-top:max(24px, env(safe-area-inset-top))}}
.pr{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap;vertical-align:1px;background:var(--pr-soft);color:var(--pr)}
.pr-panel{border-color:var(--pr)}
button.pr-btn{color:var(--pr);border-color:var(--pr)}
.pr-why{color:var(--pr)}
.pr-item{border-left:5px solid var(--pr)}
.pr-reason{font-size:14px;color:var(--pr);margin-top:4px;line-height:1.6}
.prow .pr{margin-left:4px}
.tl{margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface)}
.tl-h{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:10px}
.tl-chart{position:relative;padding:0 2px}
.tl-yrs{display:grid;grid-template-columns:1fr 1fr;font-size:11px;color:var(--muted);margin-bottom:4px}
.tl-yrs span:last-child{border-left:1px dashed var(--line);padding-left:6px}
.tl-row{position:relative;height:20px;margin-bottom:3px}
.tl-band{position:absolute;top:0;height:20px;border-radius:4px;font-size:11px;line-height:20px;padding:0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-sizing:border-box}
.tl-band.base{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.tl-band.hl{background:var(--accent-soft);color:var(--accent);font-weight:700;border:1px solid var(--accent)}
.tl-line{position:relative;height:24px;margin:2px 0}
.tl-line::before{content:"";position:absolute;left:0;right:0;top:11px;height:2px;background:var(--line);border-radius:1px}
.tl-dot{position:absolute;top:2px;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:var(--surface);border:2px solid var(--faint);color:var(--muted);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;box-sizing:border-box}
.tl-dot.hl{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);z-index:1}
.tl-months{display:grid;grid-template-columns:repeat(24,1fr);font-size:10px;color:var(--faint);text-align:center;font-variant-numeric:tabular-nums}
.tl-months span:nth-child(12){border-right:1px dashed var(--line)}
.tl-ends{display:flex;justify-content:space-between;font-size:11px;color:var(--faint)}
.tl-leg{list-style:none;margin:10px 0 0;padding:0;font-size:13px;line-height:1.7;color:var(--muted)}
.tl-leg li.hl{color:var(--ink);font-weight:700}
.tl-n{display:inline-block;min-width:20px;color:var(--faint)}
.tl-leg li.hl .tl-n{color:var(--accent)}
.gl{margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--surface);font-size:14px}
.gl summary{cursor:pointer;font-size:13px;font-weight:700}
.gl dl{margin:8px 0 0;display:grid;grid-template-columns:max-content 1fr;gap:5px 12px;line-height:1.6}
.gl dt{font-weight:700;color:var(--accent)}
.gl dd{margin:0;color:var(--ink)}
.gl-bg{margin:10px 0 0;padding-top:8px;border-top:1px solid var(--line);color:var(--muted);line-height:1.65}
.gl-bg b{color:var(--ink);margin-right:4px}
@media (max-width:720px){.gl dl{grid-template-columns:1fr;gap:0}.gl dd{margin-bottom:6px}.tl-months span:nth-child(even){visibility:hidden}.tl-dot{width:15px;height:15px;margin-left:-7.5px;top:4.5px;font-size:9px;border-width:1.5px}}
.reset-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-top:4px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--c)}
@media (prefers-reduced-motion:no-preference){.card{animation:in .18s ease-out}@keyframes in{from{transform:translateY(4px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>
<body>
<div class="page" id="root">
  <header class="top">
    <div>
      <h1>세법 빈칸 훈련</h1>
      <p class="lede">국가직 9급 세법개론 기출의 정답 문장에서, 출제자가 비트는 자리만 가립니다.</p>
    </div>
    <div class="save" id="save"><span class="dot"></span><span>기록 저장 위치 확인 중</span></div>
  </header>
  <main id="view"><div class="panel note">불러오는 중입니다.</div></main>
</div>
<script src="data/subjects.js"></script>
<script src="data/pairs.js"></script>
<script src="data/practical.js"></script>
<script src="data/timeline.js"></script>
<script src="data/glossary.js"></script>
<script>
const TRAPS = {
  "숫자": "기간·횟수·금액 (14일, 2회)",
  "시점": "언제인가 (지급하는 때 ↔ 과세기간이 끝나는 때)",
  "주체": "누구·어느 세목인가 (모두 ↔ 대표자, 법인세 ↔ 소득세)",
  "방법": "어떤 절차인가 (유치송달 ↔ 공시송달)",
  "효과": "있다 ↔ 없다, 할 수 있다 ↔ 하여야 한다"
};
const S = { subjects: window.TAX_SUBJECTS || [], data: window.TAX_DATA || {}, prog: {}, store: { mode: "none", db: null, uid: null }, train: null, ox: null, daily: null, pending: null };

function esc(s) { return String(s).replace(/[&<>"]/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m])); }

/* ---------- 기출 횟수: 같은 내용이 서로 다른 시험(연도·문항)에 나온 횟수 ---------- */
const FQ = new WeakMap();

  let m; const re = /(20\d\d)년 (\d+)번/g;
  while ((m = re.exec(s))) set.add(m[1] + "-" + m[2]);
  const keys = [...set].sort();
  const out = { n: keys.length, keys, years: [...new Set(keys.map(k => k.split("-")[0]))] };
  FQ.set(c, out); return out;
}

}

function badgeRow(c, short) { const h = fqBadge(c, short) + prBadge(c); return h ? '<div class="fq-row">' + h + "</div>" : ""; }
function fqClass(c) { const lv = fqLevel(freqOf(c).n); return lv ? " fqcard f" + lv : ""; }

async function initStore() {
  if (!window.claude || !window.claude.use) return;
  try {
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;
    S.store.db = db; S.store.uid = uid;
    setSave("acct");
    for (const s of S.subjects) if (S.prog[s.id]) await pullRemote(s.id);
    await pullDaily();
    route();
  } catch (e) { /* 계정 저장을 못 쓰면 브라우저 저장으로 계속 */ }
}
function emptyProg() { return { cards: {}, updated: 0 }; }
function loadProg(id) {
  if (!S.prog[id]) S.prog[id] = lsGet("taxcloze:" + id) || emptyProg();
  return S.prog[id];
}
async function pullRemote(id) {
  if (!S.store.db) return;
  try {
    const ref = S.store.db.doc("data/users/" + S.store.uid + "/" + id);
    const snap = await Promise.race([ref.get(), new Promise((_, r) => setTimeout(() => r("timeout"), 10000))]);
    if (snap && snap.exists) {
      const d = snap.data();
      const local = loadProg(id);
      if ((d.updated || 0) >= (local.updated || 0)) {
        S.prog[id] = JSON.parse(JSON.stringify({ cards: d.cards || {}, updated: d.updated || 0 }));
        lsSet("taxcloze:" + id, S.prog[id]);
      } else { queueRemote(id); }
    } else if (Object.keys(loadProg(id).cards).length) { queueRemote(id); }
  } catch (e) { /* 계정 기록을 못 읽어도 브라우저 기록으로 진행 */ }
}
const writeChain = {};
function queueRemote(id) {
  if (!S.store.db) return;
  const body = JSON.parse(JSON.stringify(S.prog[id]));
  writeChain[id] = (writeChain[id] || Promise.resolve()).then(() =>
    S.store.db.doc("data/users/" + S.store.uid + "/" + id).set(body)
  ).catch(e => { if (e && e.code === "invalid_argument") { S.store.db = null; setSave(S.store.mode === "acct" ? "local" : S.store.mode); } });
}
/* 간격 반복: 맞히면 1 → 3 → 7 → 14 → 30 → 60일 뒤 다시, 틀리면 내일 다시 */
const LADDER = [1, 3, 7, 14, 30, 60];
function today() { const n = new Date(); return Math.floor((n.getTime() - n.getTimezoneOffset() * 60000) / 86400000); }
function isDue(st) { return !!st && st.last != null && (st.due == null || st.due <= today()); }
function saveProg(id, p) { p.updated = Date.now(); lsSet("taxcloze:" + id, p); queueRemote(id); }
function recordOX(id, cardId, ok) {
  const p = loadProg(id);
  const c = p.cards[cardId] || { r: 0, w: 0, last: null };
  c.ox = c.ox || { r: 0, w: 0, last: null };
  if (ok) c.ox.r++; else { c.ox.w++; c.last = 0; c.lv = 0; c.due = today() + 1; }
  c.ox.last = ok ? 1 : 0;
  p.cards[cardId] = c;
  saveProg(id, p);
}
function record(id, cardId, ok) {
  const p = loadProg(id);
  const c = p.cards[cardId] || { r: 0, w: 0, last: null };
  if (ok) c.r++; else c.w++;
  c.last = ok ? 1 : 0;
  if (ok) { c.lv = Math.min((c.lv || 0) + 1, LADDER.length); c.due = today() + LADDER[c.lv - 1]; }
  else { c.lv = 0; c.due = today() + 1; }
  p.cards[cardId] = c;
  p.updated = Date.now();
  lsSet("taxcloze:" + id, p);
  queueRemote(id);
}

function loadData(s) {
  if (S.data[s.id]) return Promise.resolve(S.data[s.id]);
  return new Promise((res, rej) => {
    const el = document.createElement("script");
    el.src = s.file;
    el.onload = () => { S.data = window.TAX_DATA || {}; S.data[s.id] ? res(S.data[s.id]) : rej(new Error("no data")); };
    el.onerror = () => rej(new Error("load failed"));
    document.head.appendChild(el);
  });
}
function stats(id) {
  const d = S.data[id], p = loadProg(id);
  const out = { total: 0, ok: 0, weak: 0, fresh: 0, due: 0, soon1: 0, soon7: 0, oxR: 0, oxW: 0, bySec: {}, byTrap: {} };
  if (!d) return out;
  const td = today();
  d.cards.forEach(c => {
    const st = p.cards[c.id];
    const sec = out.bySec[c.s] || (out.bySec[c.s] = { total: 0, ok: 0, weak: 0 });
    out.total++; sec.total++;
    if (st && st.ox) { out.oxR += st.ox.r; out.oxW += st.ox.w; }
    if (isDue(st)) out.due++;
    else if (st && st.due != null) { if (st.due <= td + 1) out.soon1++; if (st.due <= td + 7) out.soon7++; }
    if (!st || st.last == null) out.fresh++;
    else if (st.last === 1) { out.ok++; sec.ok++; }
    else { out.weak++; sec.weak++; }
    if (st && st.w) out.byTrap[c.t] = (out.byTrap[c.t] || 0) + st.w;
  });
  return out;
}

/* ---------- 훈련 ---------- */
function startTrain(id, mode, sec) {
  const d = S.data[id], p = loadProg(id);
  let idx = d.cards.map((_, i) => i);
  if (mode === "weak") idx = idx.filter(i => { const c = p.cards[d.cards[i].id]; return c && c.last === 0; });
  if (mode === "fresh") idx = idx.filter(i => { const c = p.cards[d.cards[i].id]; return !c || c.last == null; });
  if (mode === "due") idx = idx.filter(i => isDue(p.cards[d.cards[i].id]));
  if (mode === "prac") idx = idx.filter(i => pracOf(d.cards[i]));
  if (mode === "freq") idx = idx.filter(i => freqOf(d.cards[i]).n >= 2).sort((a, b) => freqOf(d.cards[b]).n - freqOf(d.cards[a]).n || a - b);
  if (mode === "sec") idx = idx.filter(i => d.cards[i].s === sec);
  if (!idx.length) return;
  const label = { all: "전체 훈련", weak: "약한 카드만", fresh: "안 본 카드만", sec: "절별 훈련", due: "오늘 복습", freq: "자주 나온 카드", prac: "실무 중요 카드" }[mode];
  S.train = newTrain(id, idx, label);
  renderTrain();
}
function newTrain(id, idx, label) {
  return { id, list: idx.slice(), st: idx.map(() => null), pos: 0, n: idx.length, ok: {}, miss: {}, label, orig: idx.slice(), cur: null };
}
function judge(c, v) {
  const n = norm(v);
  if (c.pol) {
    const neg = /없|않|아니|못|부정|^x$|^no$/.test(n);
    if (c.rej && c.rej.some(k => n.includes(norm(k)))) return "trap";
    if (norm(c.b) === n) return "exact";
    return ((c.pol === "-") === neg) ? "mean" : "trap";
  }
  if ((c.rej || []).some(k => n.includes(norm(k)))) return "trap";
  if (norm(c.b) === n) return "exact";
  if ((c.acc || []).some(k => n.includes(norm(k)))) return "mean";
  return "unk";
}
const JL = { exact: ["success", "정답"], mean: ["success", "의미가 같아서 정답 처리"], trap: ["danger", "함정 쪽 의미라 오답"], unk: ["warning", "자동 판정 불가 · 뜻이 같다면 맞음 처리를 누르세요"] };

const DAILY_N = 20;
function emptyDaily() { return { plans: {}, used: [], round: 1, updated: 0 }; }
function dailyStore() { if (!S.dailyStore) S.dailyStore = lsGet("taxcloze:daily") || emptyDaily(); return S.dailyStore; }
function saveDaily() {
  const D = dailyStore(); D.updated = Date.now(); lsSet("taxcloze:daily", D);
  if (!S.store.db) return;
  const body = JSON.parse(JSON.stringify(D));
  writeChain.daily = (writeChain.daily || Promise.resolve()).then(() => S.store.db.doc("data/users/" + S.store.uid + "/daily").set(body)).catch(() => {});
}
async function pullDaily() {
  if (!S.store.db) return;
  try {
    const snap = await Promise.race([S.store.db.doc("data/users/" + S.store.uid + "/daily").get(), new Promise((_, r) => setTimeout(() => r("timeout"), 10000))]);
    const local = dailyStore();
    if (snap && snap.exists) {
      const d = snap.data();
      if ((d.updated || 0) >= (local.updated || 0)) { S.dailyStore = Object.assign(emptyDaily(), JSON.parse(JSON.stringify(d))); lsSet("taxcloze:daily", S.dailyStore); }
      else saveDaily();
    } else if (Object.keys(local.plans).length) saveDaily();

}
function dayLabel(day, withYear) { const d = new Date(day * 86400000); return (withYear ? d.getUTCFullYear() + "년 " : "") + (d.getUTCMonth() + 1) + "월 " + d.getUTCDate() + "일 (" + "일월화수목금토"[d.getUTCDay()] + ")"; }
function readySubjects() { return S.subjects.filter(s => s.ready); }
function allLoaded() { return readySubjects().every(s => S.data[s.id]); }
function cardOf(key) { const [sid, cid] = key.split(":"); const d = S.data[sid]; if (!d) return null; const ci = d.cards.findIndex(c => c.id === cid); return ci < 0 ? null : { sid, ci, c: d.cards[ci], s: subj(sid) }; }
function ensurePlan() {
  const D = dailyStore(), td = today();
  if (D.plans[td] || !allLoaded()) return D.plans[td] || null;
  // 하나도 풀지 않은 지난 날의 카드는 출제 후보로 되돌리고 그날 기록은 지운다

    const back = new Set(D.plans[d].cards); D.used = D.used.filter(k => !back.has(k)); delete D.plans[d];
  });
  const all = [];
  readySubjects().forEach(s => S.data[s.id].cards.forEach(c => all.push(s.id + ":" + c.id)));
  let used = new Set(D.used);
  let pool = all.filter(k => !used.has(k));
  let leftover = [];
  if (pool.length < DAILY_N) {
    // 한 바퀴의 남은 카드를 먼저 넣고, 나머지는 새 바퀴에서 채운다. 남은 카드는 새 바퀴에서도 다시 나올 수 있게 둔다.
    leftover = shuffle(pool); D.round = (D.round || 1) + 1; D.used = [];
    const lo = new Set(leftover); pool = all.filter(k => !lo.has(k));

  const fresh = shuffle(pool).slice(0, DAILY_N - leftover.length);
  const picked = leftover.concat(fresh);

function planStat(pl) {

}
function dailyTotals() {

  let studied = 0, done = 0, cards = 0, first = 0, sec = 0;
  days.forEach(d => { const st = planStat(D.plans[d]); if (st.tried) studied++; if (st.done) done++; cards += st.tried; first += st.first; sec += D.plans[d].sec || 0; });
  let streak = 0, d = today();

/* ---------- 자주 나온 카드 (기출 2회 이상) ---------- */
function freqCards(filter) {
  const out = [];
  readySubjects().forEach(s => { const d = S.data[s.id]; if (!d) return; d.cards.forEach((c, ci) => { const n = freqOf(c).n; if (n < 2) return; if (filter === "3" && n < 3) return; if (filter === "2" && n !== 2) return; out.push({ sid: s.id, s, c, n, key: s.id + ":" + c.id }); }); });
  return out.sort((a, b) => b.n - a.n);
}
function freqLegend() {
  return '<div class="fq-legend"><span class="fq f2">기출 2회</span><span class="fq f3">기출 3회</span><span class="fq f4">기출 4회 이상</span></div>';
}
function freqPanelHTML() {

}

function renderFreq(filter) {

/* ---------- 과세기간 그래프 ---------- */
const TL_BASE = {
  vat: { bands: [["1-1", "6-30", "제1기"], ["7-1", "12-31", "제2기"]], marks: [["4-25", "1기 예정신고"], ["7-25", "1기 확정신고"], ["10-25", "2기 예정신고"], ["+1-25", "2기 확정신고"]] },
  inc: { bands: [["1-1", "12-31", "과세기간"], ["+5-1", "+5-31", "확정신고"]], marks: [] },
  corp: { bands: [["1-1", "12-31", "사업연도 (12월 결산 가정)"]], marks: [["+3-31", "법인세 신고 · 납부기한"]] },
  wh: { bands: [["1-1", "12-31", "소득 지급 연도"]], marks: [] },
  comp: { bands: [["12-1", "12-15", "종부세 납부"]], marks: [["6-1", "과세기준일"]] }
};
function tlPos(s, end) {
  const plus = s[0] === "+", [m, d] = s.replace("+", "").split("-").map(Number);
  const dim = new Date(2025, m, 0).getDate();
  return ((plus ? 12 : 0) + (m - 1) + (end ? d : d - 1) / dim) / 24 * 100;
}
function tlDate(s) { const plus = s[0] === "+", [m, d] = s.replace("+", "").split("-"); return (plus ? "다음 해 " : "") + +m + "월 " + +d + "일"; }
const CIRC = "①②③④⑤⑥⑦⑧⑨⑩⑪⑫";
function tlHTML(c) {
  const sp = (window.TAX_TIMELINE || {})[c.id];
  if (!sp) return "";
  let chart = "", legend = [];
  if (sp.k === "y") {
    const base = TL_BASE[sp.tax] || { bands: [], marks: [] };
    const hlDates = new Set((sp.hl || []).map(x => x[0]));
    const marks = base.marks.filter(m => !hlDates.has(m[0])).map(m => ({ at: m[0], label: m[1], hl: false }))
      .concat((sp.hl || []).map(m => ({ at: m[0], label: m[1], hl: true })))
      .sort((a, b) => tlPos(a.at) - tlPos(b.at));
    const band = (b, cls) => { const l = tlPos(b[0]), r = tlPos(b[1], true); return '<span class="tl-band ' + cls + '" style="left:' + l + "%;width:" + (r - l) + '%" title="' + esc(b[2]) + '">' + esc(b[2]) + "</span>"; };
    chart = '<div class="tl-chart">' +
      '<div class="tl-yrs"><span>올해</span><span>다음 해</span></div>' +
      '<div class="tl-row">' + base.bands.map(b => band(b, "base")).join("") + "</div>" +
      (sp.band ? '<div class="tl-row">' + sp.band.map(b => band(b, "hl")).join("") + "</div>" : "") +
      '<div class="tl-line">' + marks.map((m, i) => '<span class="tl-dot' + (m.hl ? " hl" : "") + '" style="left:' + tlPos(m.at) + '%">' + (i + 1) + "</span>").join("") + "</div>" +
      '<div class="tl-months">' + Array.from({ length: 24 }, (_, i) => "<span>" + ((i % 12) + 1) + "</span>").join("") + "</div></div>";
    legend = marks.map((m, i) => '<li class="' + (m.hl ? "hl" : "") + '"><span class="tl-n">' + CIRC[i] + "</span>" + tlDate(m.at) + " · " + esc(m.label) + "</li>");
    if (sp.band) legend = sp.band.map(b => '<li class="hl band"><span class="tl-n">▬</span>' + tlDate(b[0]) + " ~ " + tlDate(b[1]) + " · " + esc(b[2]) + "</li>").concat(legend);
  } else {
    const max = Math.max(...sp.pts.map(p => p[0])) || 1;
    const hl = new Set(sp.hl || []);
    const pos = v => 3 + v / max * 94;
    chart = '<div class="tl-chart rel"><div class="tl-line">' + sp.pts.map((p, i) => '<span class="tl-dot' + (hl.has(i) ? " hl" : "") + '" style="left:' + pos(p[0]) + '%">' + (i + 1) + "</span>").join("") + "</div>" +
      '<div class="tl-ends"><span>0' + sp.unit + "</span><span>" + max + sp.unit + "</span></div></div>";
    legend = sp.pts.map((p, i) => '<li class="' + (hl.has(i) ? "hl" : "") + '"><span class="tl-n">' + CIRC[i] + "</span>" + (p[0] === 0 ? "기준일" : p[0] + sp.unit + " 뒤") + " · " + esc(p[1]) + "</li>");
  }
  return '<div class="tl"><div class="tl-h">' + (sp.k === "y" ? "1년 과세기간에서의 위치" : "기준일부터의 기간") + (sp.tax === "corp" ? ' <span class="note">· 12월 결산 법인 기준</span>' : "") + "</div>" + chart + '<ol class="tl-leg">' + legend.join("") + "</ol></div>";
}

/* ---------- 용어 풀이 · 배경지식 ---------- */
let GL_PATS = null;
function glossFind(text) {
  const T = window.TAX_TERMS || [];
  if (!GL_PATS) { GL_PATS = []; T.forEach((o, i) => (o.m || [o.t].concat(o.a)).forEach(s => GL_PATS.push([s, i]))); GL_PATS.sort((a, b) => b[0].length - a[0].length); }
  let s = text; const hit = new Map();
  for (const [pt, i] of GL_PATS) {
    let k = s.indexOf(pt);
    while (k >= 0) { if (!hit.has(i)) hit.set(i, k); s = s.slice(0, k) + "\u0000".repeat(pt.length) + s.slice(k + pt.length); k = s.indexOf(pt); }
  }
  return [...hit.entries()].sort((a, b) => a[1] - b[1]).map(e => T[e[0]]);
}
function glossHTML(c) {
  const terms = glossFind(c.a + c.b + c.z).slice(0, 6), bg = (window.TAX_BG || {})[c.s];
  if (!terms.length && !bg) return "";
  return '<details class="gl" open><summary>용어 풀이 · 배경지식</summary>' +
    (terms.length ? '<dl>' + terms.map(o => "<dt>" + esc(o.t) + "</dt><dd>" + esc(o.d) + "</dd>").join("") + "</dl>" : "") +
    (bg ? '<p class="gl-bg"><b>배경</b> ' + esc(bg) + "</p>" : "") + "</details>";
}
