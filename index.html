<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>세법 빈칸 훈련</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
<style>
/* 법령집 같은 차분한 남색 한 가지를 기준색으로, 정답·오답·주의는 별도 의미색. 좌측 목차 + 우측 작업면 2단 */
:root{
  --bg:#F4F5F8; --surface:#FFFFFF; --ink:#1A2130; --muted:#5A6375; --faint:#8A92A3; --line:#DDE1E8;
  --accent:#27466F; --accent-ink:#FFFFFF; --accent-soft:#E5EBF4;
  --ok:#1E7448; --ok-soft:#E2F1E8; --bad:#AF3329; --bad-soft:#F8E5E3; --warn:#8C5C08; --warn-soft:#FAEFD8;
  --f-display:"Noto Serif KR","Nanum Myeongjo",serif;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12151C; --surface:#1A1F29; --ink:#E6E9EF; --muted:#A3ABBA; --faint:#7A8394; --line:#2C3340;
  --accent:#8FB0DE; --accent-ink:#0F1622; --accent-soft:#223149;
  --ok:#6CC596; --ok-soft:#173326; --bad:#F08A7F; --bad-soft:#3A1E1B; --warn:#E3B45C; --warn-soft:#352812;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#12151C; --surface:#1A1F29; --ink:#E6E9EF; --muted:#A3ABBA; --faint:#7A8394; --line:#2C3340;
  --accent:#8FB0DE; --accent-ink:#0F1622; --accent-soft:#223149;
  --ok:#6CC596; --ok-soft:#173326; --bad:#F08A7F; --bad-soft:#3A1E1B; --warn:#E3B45C; --warn-soft:#352812;
  color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6}
.page{max-width:1040px;margin:0 auto;padding:24px 20px 56px;display:flex;flex-direction:column;gap:20px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:14px}
h1{font-family:var(--f-display);font-size:28px;font-weight:700;margin:0;letter-spacing:-0.01em;text-wrap:balance}
h2{font-family:var(--f-display);font-size:21px;font-weight:600;margin:0;text-wrap:balance}
h3{font-size:15px;font-weight:700;margin:0;color:var(--ink)}
.lede{color:var(--muted);font-size:14px;margin:4px 0 0}
.save{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.dot.acct{background:var(--ok)} .dot.local{background:var(--warn)}
button,.btn{font:inherit;font-size:15px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;cursor:pointer;line-height:1.3}
button:hover:not(:disabled){border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:500}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,a:focus-visible,.sec.click:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.back{font-size:14px;text-decoration:none;color:var(--muted);background:none;border:none;padding:0;cursor:pointer}
.back:hover{color:var(--accent)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.subjects{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.subj{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px;text-align:left;cursor:pointer;color:var(--ink)}
.subj:hover:not(:disabled){border-color:var(--accent)}
.subj .nm{font-family:var(--f-display);font-size:19px;font-weight:600}
.subj .ds{font-size:13px;color:var(--muted)}
.chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:500;width:max-content}
.chip.soon{background:var(--bg);color:var(--faint);border:1px solid var(--line)}
.meter{height:6px;border-radius:3px;background:var(--bg);overflow:hidden;border:1px solid var(--line)}
.meter>i{display:block;height:100%;background:var(--accent)}
.meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile b{display:block;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.tile span{font-size:13px;color:var(--muted)}
.tile.weak b{color:var(--bad)} .tile.ok b{color:var(--ok)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.two{display:grid;grid-template-columns:260px 1fr;gap:16px;align-items:start}
@media (max-width:720px){.two{grid-template-columns:1fr}.tiles{grid-template-columns:1fr 1fr 1fr}.toc{position:static}.toc.train .ch{display:none}.toc.train .sec{display:none}.toc.train.open .ch,.toc.train.open .sec,.toc.train .sec.on{display:flex}.toc.train.open .ch{display:block}.nav button{flex:1}.toc.train .toc-toggle{display:block}.two .toc-hint{display:none}}
.toc{font-size:13px;line-height:1.45;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;position:sticky;top:12px}
.toc .ch{font-weight:700;color:var(--ink);margin-top:9px}
.toc .ch:first-child{margin-top:0}
.sec{padding:3px 6px 3px 12px;color:var(--faint);border-radius:6px;display:flex;justify-content:space-between;gap:6px}
.sec.has{color:var(--muted)}
.sec.click{cursor:pointer}
.sec.click:hover{background:var(--bg);color:var(--ink)}
.sec.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.sec .n{font-variant-numeric:tabular-nums;white-space:nowrap}
.sec .n.weak{color:var(--bad)}
.toc .sub{padding:1px 6px 4px 24px;color:var(--accent);font-size:12px}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:52px 1fr 28px;align-items:center;gap:8px;font-size:14px}
.bar i{display:block;height:10px;border-radius:5px;background:var(--warn)}
.bar .v{color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.note{font-size:13px;color:var(--muted)}
.progress{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.progress .meter{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:6px;background:var(--warn-soft);color:var(--warn);font-weight:500}
.sent{font-size:18px;line-height:1.95;margin:10px 0 14px;max-width:62ch}
.blank{display:inline-block;min-width:96px;border-bottom:2px solid var(--accent);text-align:center;color:var(--accent);font-weight:700;padding:0 4px}
.answer{display:flex;gap:8px;flex-wrap:wrap}
.answer input{flex:1;min-width:180px;font:inherit;font-size:16px;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.err{font-size:13px;color:var(--bad);min-height:18px;margin-top:4px}
.verdict{display:inline-block;padding:5px 10px;border-radius:6px;font-size:14px;font-weight:500}
.v-success{background:var(--ok-soft);color:var(--ok)} .v-danger{background:var(--bad-soft);color:var(--bad)} .v-warning{background:var(--warn-soft);color:var(--warn)}
.info{font-size:14px;line-height:1.75;margin-top:12px;border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:2px}
.lab{color:var(--muted);font-size:13px;display:inline-block;min-width:60px}
.ex{margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--bg);font-size:14px;line-height:1.8}
.exh{font-size:12px;color:var(--muted);margin-bottom:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.k{padding:1px 5px;border-radius:5px;font-weight:700}
.k-success{background:var(--ok-soft);color:var(--ok)} .k-danger{background:var(--bad-soft);color:var(--bad)} .k-warning{background:var(--warn-soft);color:var(--warn)}
.exf{margin-top:6px;font-size:13px;color:var(--muted)}
.exf b{font-weight:700}
.next{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.nav{display:flex;justify-content:space-between;gap:8px;margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
button.danger{color:var(--bad);border-color:var(--line)}
button.danger:hover:not(:disabled){border-color:var(--bad)}
button.danger.solid{background:var(--bad);color:var(--surface);border-color:var(--bad);font-weight:500}
.confirm{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--bad)}
.toc-hint{margin:8px 2px 0}
.toc-toggle{display:none;width:100%;margin-bottom:8px;font-size:13px;padding:6px 10px}
.due-panel{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-color:var(--accent)}
.ox-text{font-size:17px;line-height:1.85}
.ox-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4px}
.ox-btn{font-size:34px;font-weight:700;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.1}
.ox-btn span{font-size:13px;font-weight:500;color:var(--muted)}
.ox-btn[data-pick="O"]{color:var(--ok)} .ox-btn[data-pick="X"]{color:var(--bad)}
.ox-btn[data-pick="O"]:hover{border-color:var(--ok);background:var(--ok-soft)} .ox-btn[data-pick="X"]:hover{border-color:var(--bad);background:var(--bad-soft)}
.wrong-list{margin:8px 0 0;padding-left:18px;font-size:14px;line-height:1.7}
.pair-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pair-tip{font-size:14px;color:var(--muted);margin:6px 0 10px;line-height:1.6}
.ptable{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden;font-size:14px}
.prow{display:grid;grid-template-columns:1.3fr 1.2fr 1fr;gap:10px;padding:8px 12px;border-top:1px solid var(--line)}
.prow:first-child{border-top:none}
.phead{background:var(--bg);font-size:12px;color:var(--muted);font-weight:500}
.pans{font-weight:700;color:var(--ok)} .ptrap{color:var(--bad)}
.pref{grid-template-columns:1fr;background:var(--accent-soft);color:var(--accent);font-size:13px}
@media (max-width:720px){.prow{grid-template-columns:1fr;gap:2px}.phead{display:none}.ptrap::before{content:"함정: ";color:var(--muted)}}
.reset-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-top:4px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--c)}
@media (prefers-reduced-motion:no-preference){.card{animation:in .18s ease-out}@keyframes in{from{transform:translateY(4px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>
<body>
<div class="page" id="root">
  <header class="top">
    <div>
      <h1>세법 빈칸 훈련</h1>
      <p class="lede">국가직 9급 세법개론 기출의 정답 문장에서, 출제자가 비트는 자리만 가립니다.</p>
    </div>
    <div class="save" id="save"><span class="dot"></span><span>기록 저장 위치 확인 중</span></div>
  </header>
  <main id="view"><div class="panel note">불러오는 중입니다.</div></main>
</div>
<script src="data/subjects.js"></script>
<script src="data/pairs.js"></script>
<script>
const TRAPS = {
  "숫자": "기간·횟수·금액 (14일, 2회)",
  "시점": "언제인가 (지급하는 때 ↔ 과세기간이 끝나는 때)",
  "주체": "누구·어느 세목인가 (모두 ↔ 대표자, 법인세 ↔ 소득세)",
  "방법": "어떤 절차인가 (유치송달 ↔ 공시송달)",
  "효과": "있다 ↔ 없다, 할 수 있다 ↔ 하여야 한다"
};
const S = { subjects: window.TAX_SUBJECTS || [], data: window.TAX_DATA || {}, prog: {}, store: { mode: "none", db: null, uid: null }, train: null, ox: null, pending: null };
const view = document.getElementById("view");

function esc(s) { return String(s).replace(/[&<>"]/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m])); }
function norm(s) { return s.replace(/[\s.,·]/g, "").toLowerCase(); }
function subj(id) { return S.subjects.find(s => s.id === id); }

/* ---------- 기록 저장 ---------- */
function lsGet(k) { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
function setSave(mode) {
  S.store.mode = mode;
  const t = { acct: "기록: 내 계정에 저장", local: "기록: 이 브라우저에만 저장", none: "기록 저장 안 됨 · 이번 방문만" }[mode];
  document.getElementById("save").innerHTML = '<span class="dot ' + mode + '"></span><span>' + t + "</span>";
}
setSave(lsSet("taxcloze:probe", 1) ? "local" : "none");

async function initStore() {
  if (!window.claude || !window.claude.use) return;
  try {
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;
    S.store.db = db; S.store.uid = uid;
    setSave("acct");
    for (const s of S.subjects) if (S.prog[s.id]) await pullRemote(s.id);
    route();
  } catch (e) { /* 계정 저장을 못 쓰면 브라우저 저장으로 계속 */ }
}
function emptyProg() { return { cards: {}, updated: 0 }; }
function loadProg(id) {
  if (!S.prog[id]) S.prog[id] = lsGet("taxcloze:" + id) || emptyProg();
  return S.prog[id];
}
async function pullRemote(id) {
  if (!S.store.db) return;
  try {
    const ref = S.store.db.doc("data/users/" + S.store.uid + "/" + id);
    const snap = await Promise.race([ref.get(), new Promise((_, r) => setTimeout(() => r("timeout"), 10000))]);
    if (snap && snap.exists) {
      const d = snap.data();
      const local = loadProg(id);
      if ((d.updated || 0) >= (local.updated || 0)) {
        S.prog[id] = JSON.parse(JSON.stringify({ cards: d.cards || {}, updated: d.updated || 0 }));
        lsSet("taxcloze:" + id, S.prog[id]);
      } else { queueRemote(id); }
    } else if (Object.keys(loadProg(id).cards).length) { queueRemote(id); }
  } catch (e) { /* 계정 기록을 못 읽어도 브라우저 기록으로 진행 */ }
}
const writeChain = {};
function queueRemote(id) {
  if (!S.store.db) return;
  const body = JSON.parse(JSON.stringify(S.prog[id]));
  writeChain[id] = (writeChain[id] || Promise.resolve()).then(() =>
    S.store.db.doc("data/users/" + S.store.uid + "/" + id).set(body)
  ).catch(e => { if (e && e.code === "invalid_argument") { S.store.db = null; setSave(S.store.mode === "acct" ? "local" : S.store.mode); } });
}
/* 간격 반복: 맞히면 1 → 3 → 7 → 14 → 30 → 60일 뒤 다시, 틀리면 내일 다시 */
const LADDER = [1, 3, 7, 14, 30, 60];
function today() { const n = new Date(); return Math.floor((n.getTime() - n.getTimezoneOffset() * 60000) / 86400000); }
function isDue(st) { return !!st && st.last != null && (st.due == null || st.due <= today()); }
function saveProg(id, p) { p.updated = Date.now(); lsSet("taxcloze:" + id, p); queueRemote(id); }
function recordOX(id, cardId, ok) {
  const p = loadProg(id);
  const c = p.cards[cardId] || { r: 0, w: 0, last: null };
  c.ox = c.ox || { r: 0, w: 0, last: null };
  if (ok) c.ox.r++; else { c.ox.w++; c.last = 0; c.lv = 0; c.due = today() + 1; }
  c.ox.last = ok ? 1 : 0;
  p.cards[cardId] = c;
  saveProg(id, p);
}
function record(id, cardId, ok) {
  const p = loadProg(id);
  const c = p.cards[cardId] || { r: 0, w: 0, last: null };
  if (ok) c.r++; else c.w++;
  c.last = ok ? 1 : 0;
  if (ok) { c.lv = Math.min((c.lv || 0) + 1, LADDER.length); c.due = today() + LADDER[c.lv - 1]; }
  else { c.lv = 0; c.due = today() + 1; }
  p.cards[cardId] = c;
  p.updated = Date.now();
  lsSet("taxcloze:" + id, p);
  queueRemote(id);
}

/* ---------- 과목 데이터 ---------- */
function loadData(s) {
  if (S.data[s.id]) return Promise.resolve(S.data[s.id]);
  return new Promise((res, rej) => {
    const el = document.createElement("script");
    el.src = s.file;
    el.onload = () => { S.data = window.TAX_DATA || {}; S.data[s.id] ? res(S.data[s.id]) : rej(new Error("no data")); };
    el.onerror = () => rej(new Error("load failed"));
    document.head.appendChild(el);
  });
}
function stats(id) {
  const d = S.data[id], p = loadProg(id);
  const out = { total: 0, ok: 0, weak: 0, fresh: 0, due: 0, soon1: 0, soon7: 0, oxR: 0, oxW: 0, bySec: {}, byTrap: {} };
  if (!d) return out;
  const td = today();
  d.cards.forEach(c => {
    const st = p.cards[c.id];
    const sec = out.bySec[c.s] || (out.bySec[c.s] = { total: 0, ok: 0, weak: 0 });
    out.total++; sec.total++;
    if (st && st.ox) { out.oxR += st.ox.r; out.oxW += st.ox.w; }
    if (isDue(st)) out.due++;
    else if (st && st.due != null) { if (st.due <= td + 1) out.soon1++; if (st.due <= td + 7) out.soon7++; }
    if (!st || st.last == null) out.fresh++;
    else if (st.last === 1) { out.ok++; sec.ok++; }
    else { out.weak++; sec.weak++; }
    if (st && st.w) out.byTrap[c.t] = (out.byTrap[c.t] || 0) + st.w;
  });
  return out;
}

/* ---------- 화면: 과목 고르기 ---------- */
function renderHome() {
  let h = '<div style="display:flex;flex-direction:column;gap:14px"><div><h2>과목</h2><p class="lede">과목을 고르면 장·절 목차와 내 약점이 나옵니다. 열리지 않은 과목은 카드가 준비되는 대로 추가됩니다.</p></div><div class="subjects">';
  S.subjects.forEach(s => {
    if (!s.ready) {
      h += '<button class="subj" disabled><span class="chip soon">준비 중</span><span class="nm">' + esc(s.name) + '</span><span class="ds">' + esc(s.desc) + "</span></button>";
      return;
    }
    const st = stats(s.id);
    const loaded = !!S.data[s.id];
    const pct = st.total ? Math.round(st.ok / st.total * 100) : 0;
    h += '<button class="subj" data-go="' + s.id + '"><span class="chip">훈련 가능</span><span class="nm">' + esc(s.name) + '</span><span class="ds">' + esc(s.desc) + "</span>" +
      (loaded ? '<div class="meter"><i style="width:' + pct + '%"></i></div><span class="meta">맞힌 카드 ' + st.ok + " / " + st.total + (st.weak ? " · 약한 카드 " + st.weak : "") + "</span>" : '<span class="meta">카드 불러오는 중</span>') + "</button>";
  });
  h += "</div>";
  const dueSubs = S.subjects.filter(s => s.ready && S.data[s.id]).map(s => ({ s, st: stats(s.id) }));
  const dueTotal = dueSubs.reduce((a, x) => a + x.st.due, 0), soon = dueSubs.reduce((a, x) => a + x.st.soon1, 0);
  const studied = dueSubs.some(x => x.st.total - x.st.fresh);
  let duePanel = "";

/* ---------- 훈련 ---------- */
function startTrain(id, mode, sec) {
  const d = S.data[id], p = loadProg(id);
  let idx = d.cards.map((_, i) => i);
  if (mode === "weak") idx = idx.filter(i => { const c = p.cards[d.cards[i].id]; return c && c.last === 0; });
  if (mode === "fresh") idx = idx.filter(i => { const c = p.cards[d.cards[i].id]; return !c || c.last == null; });
  if (mode === "due") idx = idx.filter(i => isDue(p.cards[d.cards[i].id]));
  if (mode === "sec") idx = idx.filter(i => d.cards[i].s === sec);
  if (!idx.length) return;
  const label = { all: "전체 훈련", weak: "약한 카드만", fresh: "안 본 카드만", sec: "절별 훈련", due: "오늘 복습" }[mode];
  S.train = newTrain(id, idx, label);
  renderTrain();
}
function newTrain(id, idx, label) {
  return { id, list: idx.slice(), st: idx.map(() => null), pos: 0, n: idx.length, ok: {}, miss: {}, label, orig: idx.slice(), cur: null };
}
function judge(c, v) {
  const n = norm(v);
  if (c.pol) {
    const neg = /없|않|아니|못|부정|^x$|^no$/.test(n);
    if (c.rej && c.rej.some(k => n.includes(norm(k)))) return "trap";
    if (norm(c.b) === n) return "exact";
    return ((c.pol === "-") === neg) ? "mean" : "trap";
  }
  if ((c.rej || []).some(k => n.includes(norm(k)))) return "trap";
  if (norm(c.b) === n) return "exact";
  if ((c.acc || []).some(k => n.includes(norm(k)))) return "mean";
  return "unk";
}
const JL = { exact: ["success", "정답"], mean: ["success", "의미가 같아서 정답 처리"], trap: ["danger", "함정 쪽 의미라 오답"], unk: ["warning", "자동 판정 불가 · 뜻이 같다면 맞음 처리를 누르세요"] };
function exHTML(c) {
  const e = c.ex;
  if (!e) return "";
  const tag = { O: ["success", "시험지 · 맞는 지문(O)"], X: ["danger", "시험지 · 비튼 지문(X)"], L: ["warning", "기출 원문 없음 · 법령 원문"] }[e.k];
  let h = '<div class="ex"><div class="exh"><span class="k k-' + tag[0] + '">' + tag[1] + "</span><span>" + esc(e.src) + "</span></div>" +
    esc(e.p) + '<span class="k k-' + tag[0] + '">' + esc(e.w) + "</span>" + esc(e.q);
  if (e.k === "O") h += '<div class="exf">시험지 정답 단어: <b style="color:var(--ok)">' + esc(e.w) + "</b></div>";
  if (e.k === "X") h += '<div class="exf">시험지 단어 <b style="color:var(--bad)">' + esc(e.w) + '</b> → 법령상 정답 단어 <b style="color:var(--ok)">' + esc(c.b) + "</b>" + (e.note ? "<br>" + esc(e.note) : "") + "</div>";
  if (e.k === "L") h += '<div class="exf">법령 정답 단어: <b style="color:var(--ok)">' + esc(e.w) + "</b> · 숫자를 바꿔 출제할 수 있는 자리</div>";
  return h + "</div>";
}
function resultHTML(c, v, j) {
  const L = JL[j];
  return '<div class="info"><div><span class="verdict v-' + L[0] + '">' + esc(v) + " → " + L[1] + "</span></div>" +
    '<div style="margin-top:6px"><span class="lab">이유</span>' + esc(c.why) + "</div>" +
    '<div><span class="lab">비틀면</span>' + esc(c.trap) + "</div></div>" + exHTML(c);
}
function doneCount(T) { return Object.keys(T.ok).length; }
function skippedPos(T) {
  // 아직 한 번도 채점하지 않은 카드의 위치 (같은 카드가 뒤에서 채점됐으면 제외)
  const graded = new Set();
  T.list.forEach((ci, k) => { if (T.st[k]) graded.add(ci); });
  const seen = new Set(), out = [];
  T.list.forEach((ci, k) => { if (!T.st[k] && !graded.has(ci) && !seen.has(ci)) { seen.add(ci); out.push(k); } });
  return out;
}
function trainHead(T, s, c) {
  return '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><button class="back" data-exit>← ' + esc(s.name) + " 개요로</button><span class=\"note\">" + esc(T.label) + " · " + (T.pos + 1) + "번째 / " + T.list.length + "</span></div>" +
    '<div class="progress"><div class="meter"><i style="width:' + (doneCount(T) / T.n * 100) + '%"></i></div><span>맞힘 ' + doneCount(T) + " / " + T.n + "</span></div>" +
    '<div class="two"><div><div class="toc train" aria-label="목차 · 누르면 그 절로 이동"><button class="toc-toggle" data-toc aria-expanded="false">목차 펼치기 ▾</button>' + tocHTML(T.id, c, true) + '</div><p class="note toc-hint">절 이름을 누르면 그 절 문제로 이동합니다.</p></div>';
}
function navHTML(T) {
  const last = T.pos >= T.list.length - 1;
  const label = T.cur ? "다음 문제 →" : (T.st[T.pos] ? (last ? "결과 보기 →" : "다음 문제 →") : (last ? "건너뛰고 결과 보기 →" : "건너뛰기 →"));

function bindTrain() {

}
function renderTrain() {
  const T = S.train, d = S.data[T.id], s = subj(T.id);

  const c = d.cards[T.list[T.pos]], h = T.st[T.pos];

      '<div class="sent">' + esc(c.a) + '<span class="blank">' + esc(c.b) + "</span>" + esc(c.z) + "</div>" + resultHTML(c, h.v, h.j);
  } else {

  bindTrain();

}
function move(pos) { S.train.pos = pos; renderTrain(); window.scrollTo(0, 0); }
function goPrev() { const T = S.train; if (T.pos > 0) move(T.pos - 1); }
function goNext() {

}
function jumpSec(sec) {
  const T = S.train, d = S.data[T.id];

  if (k < 0) k = T.list.findIndex(ci => d.cards[ci].s === sec);

    const add = d.cards.map((c, i) => i).filter(i => d.cards[i].s === sec);
    if (!add.length) return;
    k = T.list.length;
    add.forEach(i => { T.list.push(i); T.st.push(null); if (!T.orig.includes(i)) { T.orig.push(i); T.n++; } });

function grade(ok) {

  T.cur = null;

}
function renderSummary() {

    "<h2>" + esc(T.label) + (sk.length ? " · 건너뛴 문제 " + sk.length + "개 남음" : " 완료 · " + T.n + "장") + "</h2>" +

/* ---------- 실전 O/X ---------- */
function oxItems(id, filter) {
  const d = S.data[id], p = loadProg(id), seen = new Set(), out = [];
  if (!d) return out;
  d.cards.forEach((c, ci) => {
    const e = c.ex;
    if (!e || (e.k !== "O" && e.k !== "X") || /계산/.test(e.src)) return;
    const y = (e.src.match(/^(20\d\d)년/) || [])[1];
    if (!y) return;
    const text = (e.p + e.w + e.q).trim();
    if (seen.has(text)) return;
    seen.add(text);
    if (filter === "wrong") { const st = p.cards[c.id]; if (!st || !st.ox || st.ox.last !== 0) return; }
    else if (filter && filter !== y) return;
    out.push({ ci, k: e.k, y });
  });
  return out;
}
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function renderOXSetup(id) {
  const s = subj(id), all = oxItems(id), wrong = oxItems(id, "wrong");
  const years = [...new Set(all.map(x => x.y))].sort();
  view.innerHTML = '<div class="card" style="display:flex;flex-direction:column;gap:14px;max-width:720px">' +
    '<div><button class="back" data-back>← ' + esc(s.name) + " 개요로</button><h2 style=\"margin-top:6px\">실전 O/X</h2>" +
    '<p class="lede">시험지에 나온 지문 그대로 보고 맞는 지문(O)인지 비튼 지문(X)인지 고릅니다. 틀린 지문의 카드는 다음 날 빈칸 복습에도 나옵니다. 키보드 O · X 키로도 고를 수 있습니다.</p></div>' +
    '<div class="actions"><button class="primary" data-oxgo="">전체 섞어서 (' + all.length + ")</button>" +
    (wrong.length ? '<button data-oxgo="wrong">지난번 틀린 지문만 (' + wrong.length + ")</button>" : "") + "</div>" +
    '<div><h3>연도별</h3><div class="actions" style="margin-top:8px">' + years.map(y => '<button data-oxgo="' + y + '">' + y + "년 (" + all.filter(x => x.y === y).length + ")</button>").join("") + "</div></div></div>";
  view.querySelector("[data-back]").addEventListener("click", () => renderSubject(id));
  view.querySelectorAll("[data-oxgo]").forEach(b => b.addEventListener("click", () => startOX(id, b.dataset.oxgo)));
  window.scrollTo(0, 0);
}
function startOX(id, filter, items) {
  const list = items || shuffle(oxItems(id, filter));
  if (!list.length) return;
  const label = filter === "wrong" ? "틀린 지문" : filter ? filter + "년" : "전체";
  S.train = null;
  S.ox = { id, filter, label, list, res: list.map(() => null), pos: 0 };
  renderOX();
}
function oxScore(O) { const done = O.res.filter(Boolean); return { done: done.length, ok: done.filter(r => r.ok).length }; }
function renderOX() {
  const O = S.ox, s = subj(O.id), d = S.data[O.id];
  if (O.pos >= O.list.length) { renderOXSummary(); return; }
  const it = O.list[O.pos], c = d.cards[it.ci], e = c.ex, r = O.res[O.pos], sc = oxScore(O);
  let body = '<div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><span class="tag">' + esc(c.sub) + "</span>" + (r ? '<span class="note">' + esc(e.src) + "</span>" : "") + "</div>";
  if (!r) {
    body += '<div class="sent ox-text">' + esc(e.p + e.w + e.q) + "</div>" +
      '<div class="ox-row"><button class="ox-btn" data-pick="O" aria-label="맞는 지문 O">O<span>맞는 지문</span></button><button class="ox-btn" data-pick="X" aria-label="비튼 지문 X">X<span>비튼 지문</span></button></div>';
  } else {
    const cls = e.k === "O" ? "success" : "danger";
    body += '<div class="sent ox-text">' + esc(e.p) + '<span class="k k-' + cls + '">' + esc(e.w) + "</span>" + esc(e.q) + "</div>" +
      '<div class="info"><div><span class="verdict v-' + (r.ok ? "success" : "danger") + '">' + r.pick + " 선택 → " + (r.ok ? "정답" : "오답") + " · 이 지문은 " + (e.k === "O" ? "맞는 지문(O)" : "비튼 지문(X)") + "</span></div>" +
      (e.k === "X" ? '<div style="margin-top:6px"><span class="lab">고칠 곳</span><b style="color:var(--bad)">' + esc(e.w) + '</b> → <b style="color:var(--ok)">' + esc(c.b) + "</b>" + (e.note ? "<br>" + esc(e.note) : "") + "</div>" : "") +
      '<div><span class="lab">이유</span>' + esc(c.why) + "</div>" +
      '<div><span class="lab">빈칸 카드</span>' + esc(c.a) + "<b>" + esc(c.b) + "</b>" + esc(c.z) + "</div></div>";
  }
  const last = O.pos >= O.list.length - 1;
  body += '<div class="nav"><button data-prev' + (O.pos > 0 ? "" : " disabled") + '>← 이전 지문</button><button data-next>' + (r ? (last ? "결과 보기 →" : "다음 지문 →") : (last ? "건너뛰고 결과 보기 →" : "건너뛰기 →")) + "</button></div>";
  view.innerHTML = '<div style="display:flex;flex-direction:column;gap:14px;max-width:820px">' +
    '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><button class="back" data-exit>← ' + esc(s.name) + ' 개요로</button><span class="note">실전 O/X · ' + esc(O.label) + " · " + (O.pos + 1) + "번째 / " + O.list.length + "</span></div>" +
    '<div class="progress"><div class="meter"><i style="width:' + (sc.done / O.list.length * 100) + '%"></i></div><span>정답 ' + sc.ok + " / 푼 " + sc.done + "</span></div>" +
    '<div class="card">' + body + "</div></div>";
  view.querySelector("[data-exit]").addEventListener("click", exitOX);
  view.querySelector("[data-prev]").addEventListener("click", () => { if (O.pos > 0) { O.pos--; renderOX(); } });
  view.querySelector("[data-next]").addEventListener("click", () => { O.pos++; renderOX(); window.scrollTo(0, 0); });
  view.querySelectorAll("[data-pick]").forEach(b => b.addEventListener("click", () => oxPick(b.dataset.pick)));
  const f = view.querySelector(r ? "[data-next]" : "[data-pick]"); if (f) f.focus();
}
function oxPick(pick) {
  const O = S.ox; if (!O || O.res[O.pos]) return;
  const it = O.list[O.pos], c = S.data[O.id].cards[it.ci], ok = pick === it.k;
  O.res[O.pos] = { pick, ok };
  recordOX(O.id, c.id, ok);
  renderOX();
}
function renderOXSummary() {
  const O = S.ox, s = subj(O.id), d = S.data[O.id], sc = oxScore(O);
  const wrongItems = O.list.filter((_, i) => O.res[i] && !O.res[i].ok);
  const skipped = O.list.filter((_, i) => !O.res[i]);
  view.innerHTML = '<div class="card" style="display:flex;flex-direction:column;gap:12px;max-width:720px">' +
    "<h2>실전 O/X " + esc(O.label) + " · " + sc.ok + " / " + sc.done + "</h2>" +
    '<p class="note" style="margin:0">정답률 ' + (sc.done ? Math.round(sc.ok / sc.done * 100) : 0) + "%" + (skipped.length ? " · 건너뛴 지문 " + skipped.length + "개" : "") + "</p>" +
    (wrongItems.length ? '<div><h3>틀린 지문</h3><ul class="wrong-list">' + wrongItems.map(it => { const c = d.cards[it.ci]; return "<li><span class=\"note\">" + esc(c.ex.src) + "</span> " + esc(c.sub) + " · " + (c.ex.k === "X" ? esc(c.ex.w) + " → <b>" + esc(c.b) + "</b>" : "맞는 지문이었음") + "</li>"; }).join("") + "</ul></div>" : (sc.done ? '<p style="margin:0;color:var(--ok)">모두 맞혔습니다.</p>' : "")) +
    '<div class="actions">' + (wrongItems.length ? '<button class="primary" data-w>틀린 지문만 다시 (' + wrongItems.length + ")</button>" : "") +
    (skipped.length ? '<button data-sk>건너뛴 지문 풀기 (' + skipped.length + ")</button>" : "") +
    '<button data-again>다시 섞어서</button><button data-prev>← 이전 지문</button><button data-exit>' + esc(s.name) + " 개요로</button></div></div>";
  view.querySelector("[data-exit]").addEventListener("click", exitOX);
  view.querySelector("[data-prev]").addEventListener("click", () => { O.pos = O.list.length - 1; renderOX(); });
  view.querySelector("[data-again]").addEventListener("click", () => startOX(O.id, O.filter));
  const w = view.querySelector("[data-w]"); if (w) w.addEventListener("click", () => startOX(O.id, "wrong", shuffle(wrongItems.slice())));
  const k = view.querySelector("[data-sk]"); if (k) k.addEventListener("click", () => { O.pos = O.list.indexOf(skipped[0]); renderOX(); });
  window.scrollTo(0, 0);
}
function exitOX() { const id = S.ox.id; S.ox = null; renderSubject(id); window.scrollTo(0, 0); }
document.addEventListener("keydown", e => {
  if (!S.ox || e.target.tagName === "INPUT" || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === "o" || k === "ㅐ") { e.preventDefault(); oxPick("O"); }
  else if (k === "x" || k === "ㅌ") { e.preventDefault(); oxPick("X"); }
});

/* ---------- 헷갈리는 짝 ---------- */
function renderPairs(id) {
  const s = subj(id), d = S.data[id], groups = (window.TAX_PAIRS || {})[id] || [];
  const byId = new Map(d.cards.map((c, i) => [c.id, i]));
  const allIdx = [...new Set(groups.flatMap(g => g.cards.map(x => byId.get(x)).filter(x => x !== undefined)))];
  view.innerHTML = '<div style="display:flex;flex-direction:column;gap:14px">' +
    '<div><button class="back" data-back>← ' + esc(s.name) + ' 개요로</button><h2 style="margin-top:6px">헷갈리는 짝</h2>' +
    '<p class="lede">출제자가 서로 바꿔 내는 숫자 · 개념을 묶었습니다. 표로 비교한 뒤 연달아 풀어 보세요.</p></div>' +
    '<div class="actions"><button class="primary" data-pall>모든 묶음 연달아 풀기 (' + allIdx.length + "장)</button></div>" +
    groups.map((g, gi) => {
      const rows = g.cards.map(x => d.cards[byId.get(x)]).filter(Boolean);
      return '<div class="panel pair"><div class="pair-head"><h3>' + esc(g.title) + '</h3><button data-pg="' + gi + '">연달아 풀기 (' + rows.length + "장)</button></div>" +
        '<p class="pair-tip">' + esc(g.tip) + "</p>" +
        '<div class="ptable"><div class="prow phead"><span>항목</span><span>정답</span><span>자주 나오는 함정</span></div>' +
        rows.map(c => '<div class="prow"><span>' + esc(c.sub) + '</span><span class="pans">' + esc(c.b) + '</span><span class="ptrap">' + esc(c.trap) + "</span></div>").join("") +
        (g.ref || []).map(r => '<div class="prow pref"><span>다른 과목 비교 · ' + esc(r) + "</span></div>").join("") + "</div></div>";
    }).join("") + "</div>";
  view.querySelector("[data-back]").addEventListener("click", () => renderSubject(id));
  view.querySelector("[data-pall]").addEventListener("click", () => { S.train = newTrain(id, allIdx, "헷갈리는 짝 전체"); renderTrain(); });
  view.querySelectorAll("[data-pg]").forEach(b => b.addEventListener("click", () => {
    const g = groups[+b.dataset.pg];
    S.train = newTrain(id, g.cards.map(x => byId.get(x)).filter(x => x !== undefined), "짝: " + g.title);
    renderTrain(); window.scrollTo(0, 0);
  }));
  window.scrollTo(0, 0);
}

/* ---------- 기록 초기화 ---------- */
function resetProg(ids) {
  ids.forEach(id => {
    S.prog[id] = { cards: {}, updated: Date.now() };
    lsSet("taxcloze:" + id, S.prog[id]);
    queueRemote(id);
  });
}
function armReset(btn, msg, onYes) {
  btn.addEventListener("click", () => {
    const box = document.createElement("span");
    box.className = "confirm";
    box.innerHTML = '<span>' + esc(msg) + '</span><button class="danger solid" data-yes>초기화</button><button data-no>취소</button>';
    btn.replaceWith(box);
    box.querySelector("[data-no]").focus();
    box.querySelector("[data-yes]").addEventListener("click", onYes);
    box.querySelector("[data-no]").addEventListener("click", () => { box.replaceWith(btn); btn.focus(); });
  });
}

/* ---------- 라우팅 ---------- */
function route() {
  if (S.train || S.ox) return;
  const h = (location.hash || "").replace("#", "");
  if (!h || h === "home") renderHome(); else renderSubject(h);
}
window.addEventListener("hashchange", () => {
  S.train = null; S.ox = null; route(); window.scrollTo(0, 0);
  if (S.pending) { const f = S.pending; S.pending = null; f(); }
});
route();
initStore();
</script>
